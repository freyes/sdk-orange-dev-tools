name: Release to latest/edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sdkcraft
        run: sudo snap install sdkcraft --classic

      - name: Log in to the SDK Store
        env:
          SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
        run: sdkcraft login

      - name: Pack SDK
        run: |
          mkdir -p dist
          sdkcraft pack -v -o dist

      - name: Upload and release to latest/edge
        run: |
          shopt -s nullglob
          for sdk in dist/*.sdk; do
            echo "Releasing $sdk to latest/edge"
            sdkcraft upload "$sdk" --release latest/edge
          done
