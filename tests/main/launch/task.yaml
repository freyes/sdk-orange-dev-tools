summary: Launch workshop with orange-dev-tools SDK

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  workshop exec -- bash -lc 'set -euo pipefail
  . /etc/os-release
  
  # (a) Copy fixtures from mounted project dir
  rm -rf /project/build-test
  mkdir -p /project/build-test
  cp -a /project/fixtures/hello-world /project/fixtures/hello-dep /project/build-test/
  
  # (b) Verify tools
  command -v sbuild
  command -v dput
  command -v mmdebstrap
  command -v distro-info
  command -v create-sbuild-chroots
  test -x /usr/sbin/squid
  
  # (c) Verify configs
  test -f ~/.sbuildrc
  test -f ~/.dput.d/profiles/local.json
  test -f ~/.mini-dinstall.conf
  test -f /etc/squid/squid.conf
  test -f /etc/apt/apt.conf.d/90proxy
  
  # (d) Verify squid proxy is listening
  (echo > /dev/tcp/127.0.0.1/3128) 2>/dev/null
  
  # (e) Structural suite check
  distro-info --supported | while read s; do
    grep -Fx "[$s]" ~/.mini-dinstall.conf || exit 1
  done
  
  # (f) sbuild config acceptance
  sbuild --help >/dev/null 2>&1
  
  # (g) Set changelog distribution to current suite
  cd /project/build-test/hello-world
  dch --release --distribution "$VERSION_CODENAME" --force-distribution ""
  cd /project/build-test/hello-dep
  dch --release --distribution "$VERSION_CODENAME" --force-distribution ""
  
  # (h) Create chroot
  create-sbuild-chroots "$VERSION_CODENAME"
  
  # (i) Build hello-world
  cd /project/build-test/hello-world
  dpkg-buildpackage -us -uc
  
  # (j) Upload to local repo
  dput local /project/build-test/hello-world_0.1_*.changes
  
  # (k) Verify Packages index
  test -f /project/local-repo/dists/$VERSION_CODENAME/main/binary-amd64/Packages
  
  # (l) Build hello-dep against local repo
  cd /project/build-test/hello-dep
  CHROOT_SETUP="mkdir -p /project && mount --bind /project/build-test /project/build-test && dpkg -i /project/build-test/hello-world_0.1_all.deb || true"
  sbuild --dist=$VERSION_CODENAME --chroot-setup-commands="sh -c '$CHROOT_SETUP'"
  
  # (m) Assert hello-dep .deb produced
  test -f /project/build-test/hello-dep_*.deb
  '

debug: |
  workshop tasks
