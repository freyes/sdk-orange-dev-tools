name: orange-dev-tools
version: "0.1"
summary: Ubuntu packaging development environment
description: |
  Workshop SDK providing sbuild, mmdebstrap, dput, mini-dinstall, and git-ubuntu
  for local Ubuntu package building. Supports dynamic suite discovery via
  distro-info and includes a create-sbuild-chroots action for pre-building
  sbuild chroot tarballs on demand.
license: GPL-3.0
platforms:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

parts:
  orange-dev-tools:
    plugin: nil
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      install -m 0755 "$CRAFT_PROJECT_DIR/bin/create-sbuild-chroots" "$CRAFT_PART_INSTALL/bin/create-sbuild-chroots"
